<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Apply online with The Excellent Management Company for recruitment, leadership and management opportunities in Newcastle upon Tyne."
    >

    <meta
        name="keywords"
        content="TEMC recruitment, Newcastle jobs, management careers, recruitment company, leadership opportunities"
    >

    <meta name="robots" content="index, follow">
    <meta name="author" content="The Excellent Management Company">

    <title>Apply Online | The Excellent Management Company</title>

    <link rel="stylesheet" href="style.css?v=23">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061b2f;
            color: white;
        }

        .navbar {
            background: #03111f;
            padding: 18px 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 2px solid #ff6600;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .navbar a:hover,
        .navbar a.active {
            background: #ff6600;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            background: #123456;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            font-size: 18px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .uploadLabel {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        button:hover {
            background: #ff7a1a;
        }

        .form-message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            .navbar a {
                display: block;
                text-align: center;
            }

            h1 {
                font-size: 40px;
            }

            .card {
                padding: 25px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar" aria-label="Main Navigation">
        <a href="index.html" class="active">Home</a>
        <a href="home.html">About</a>
        <a href="our-services.html">Our Services</a>
        <a href="careers.html">Careers</a>
        <a href="contact%20us.html">Contact Us</a>
        <a href="admin.html">Admin</a>
    </nav>

    <main class="container">

        <section class="card">

            <h1>Apply Now</h1>

            <div
                class="hero-image-placeholder"
                role="img"
                aria-label="Homepage recruitment banner placeholder image"
            >
                Homepage Hero Photograph Placeholder
            </div>

            <div class="text-placeholder">
                Add homepage introduction text here.
                Introduce The Excellent Management Company,
                your recruitment services, leadership programmes,
                company values and candidate opportunities.
            </div>

            <form id="applicationForm" enctype="multipart/form-data">

                <label for="fullName">Full Name</label>
                <input
                    id="fullName"
                    type="text"
                    name="fullName"
                    placeholder="Full Name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    id="phone"
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    autocomplete="tel"
                    required
                >

                <label for="position">Position Applying For</label>
                <input
                    id="position"
                    type="text"
                    name="position"
                    placeholder="Position Applying For"
                    required
                >

                <label for="about">Tell Us About Yourself</label>
                <textarea
                    id="about"
                    name="about"
                    placeholder="Tell us about yourself"
                ></textarea>

                <label class="uploadLabel" for="cvUpload">
                    Upload CV
                </label>

                <input
                    id="cvUpload"
                    type="file"
                    name="cv"
                    accept=".pdf,.doc,.docx"
                    required
                >

                <button type="submit">
                    Submit Application
                </button>

            </form>

            <div id="message" class="form-message" aria-live="polite"></div>

        </section>

    </main>

    <script src="script.js?v=23" defer></script>

</body>
</html>
