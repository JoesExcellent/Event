<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Online | The Excellent Management Company</title>
    <link rel="stylesheet" href="style.css?v=40">
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="active">Home</a>
    <a href="home.html" class="">About</a>
    <a href="our-services.html" class="">Our Services</a>
    <a href="careers.html" class="">Careers</a>
    <a href="contact%20us.html" class="">Contact Us</a>
    <a href="admin.html" class="">Admin</a>
</nav>

<main class="page-wrap">
    <section class="page-card">
        <h1>Apply Now</h1>
        <div class="hero-image-placeholder">Homepage Hero Photograph Placeholder</div>
        <div class="text-placeholder">
            Add homepage introduction text here. Introduce The Excellent Management Company, your recruitment services,
            leadership programmes, company values and candidate opportunities.
        </div>
        <form id="applicationForm" enctype="multipart/form-data">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" name="fullName" placeholder="Full Name" required>
            <label for="email">Email Address</label>
            <input id="email" type="email" name="email" placeholder="Email Address" required>
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" name="phone" placeholder="Phone Number" required>
            <label for="position">Position Applying For</label>
            <input id="position" type="text" name="position" placeholder="Position Applying For" required>
            <label for="about">Tell Us About Yourself</label>
            <textarea id="about" name="about" placeholder="Tell us about yourself"></textarea>
            <label class="uploadLabel" for="cvUpload">Upload CV</label>
            <input id="cvUpload" type="file" name="cv" accept=".pdf,.doc,.docx" required>
            <button type="submit">Submit Application</button>
        </form>
        <div id="message" class="form-message"></div>
    </section>
</main>
<script src="script.js?v=40"></script>

</body>
</html>
