
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Joe's Excellent Events & Management</title>

    <style>

        /* =====================================================
           GLOBAL RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071a2f;
            color: #ffffff;
            line-height: 1.6;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navbar {
            background: #03111f;

            padding: 22px 40px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;

            border-bottom: 2px solid #ff6600;
        }

        .navbar a {
            color: #ffffff;

            font-size: 1rem;
            font-weight: 700;

            padding: 14px 22px;

            border-radius: 12px;

            transition: 0.3s ease;
        }

        .navbar a:hover,
        .navbar a.active {
            background: #ff6600;
        }

        /* =====================================================
           HERO SECTION
        ===================================================== */

        .cta {
            text-align: center;

            background: linear-gradient(135deg, #102f4f, #071a2f);

            padding: 70px 20px;
        }

        .cta h2 {
            font-size: 2.3rem;
            line-height: 1.2;

            margin-bottom: 30px;

            font-weight: 800;

            color: #ffffff;
        }

        .cta h2 span {
            color: #ff6600;
        }

        /* =====================================================
           LASTS PHOTO PLACEHOLDER
        ===================================================== */

        .lasts-photo-placeholder {

            width: 70%;
            max-width: 760px;
            height: 340px;

            margin: 35px auto;

            border-radius: 28px;

            overflow: hidden;

            border: 2px solid rgba(255, 255, 255, 0.08);

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);

            background: #102b45;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lasts-photo-placeholder img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            object-position: center;

            border-radius: 20px;
        }

        .cta p {

            max-width: 850px;

            margin: 35px auto 0 auto;

            color: #ffffff;

            font-size: 1rem;

            line-height: 1.6;
        }

        .btn {

            display: inline-block;

            margin-top: 35px;

            background: #ff6600;

            color: #ffffff;

            padding: 15px 34px;

            border-radius: 12px;

            font-size: 1rem;

            font-weight: 700;

            transition: 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 900px) {

            .cta h2 {
                font-size: 1.9rem;
            }

            .lasts-photo-placeholder {

                width: 95%;
                height: auto;
            }

            .lasts-photo-placeholder img {

                width: 100%;
                height: auto;

                object-fit: contain;
            }

            .cta p {
                font-size: 0.95rem;
            }
        }

    </style>

</head>

<body>

    <!-- =====================================================
         NAVIGATION
    ===================================================== -->

    <nav class="navbar">

        <a href="index.html"
           class="active">Home</a>

        <a href="home.html">About</a>

        <a href="our-services.html">Our Services</a>

        <a href="careers.html">Careers</a>

        <a href="apply.html">Apply</a>

        <a href="contact us.html">Contact Us</a>

        <a href="admin.html">Admin</a>

    </nav>

    <!-- =====================================================
         CTA SECTION
    ===================================================== -->

    <section class="cta">

        <h2>

            Let’s Build Something<br>

            <span>That Lasts</span>

        </h2>

        <div class="lasts-photo-placeholder">

            <img src="images/lasts.png"
                 alt="Joe's Excellent Events & Management">

        </div>

        <p>

            Whether you’re a brand looking to grow or someone ready to take the next step in your career, we are ready to work with you.

        </p>

        <a href="mailto:excellentmanagement2026@gmail.com"
           class="btn">

            Contact Us

        </a>

    </section>

</body>

</html>
