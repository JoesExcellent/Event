<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Joe's Excellent Events & Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">
            <div>
                <h1>Recruitment Admin Dashboard</h1>
                <p>Manage applications, candidate status, interviews and recruitment analytics.</p>
            </div>
        </header>

        <section class="login-section" id="loginSection">
            <div class="login-card">
                <h2>Admin Login</h2>

                <form id="loginForm">
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                    <button type="submit">Login</button>
                </form>

                <p id="loginMessage"></p>
            </div>
        </section>

        <section class="admin-area hidden" id="adminArea">

            <section class="stats-grid">
                <div class="stat-card">
                    <h3>Total Applications</h3>
                    <p id="totalApplications">0</p>
                </div>

                <div class="stat-card">
                    <h3>New</h3>
                    <p id="newApplications">0</p>
                </div>

                <div class="stat-card">
                    <h3>Reviewed</h3>
                    <p id="reviewedApplications">0</p>
                </div>

                <div class="stat-card">
                    <h3>Interview Stage</h3>
                    <p id="interviewApplications">0</p>
                </div>

                <div class="stat-card">
                    <h3>Rejected</h3>
                    <p id="rejectedApplications">0</p>
                </div>

                <div class="stat-card">
                    <h3>Hired</h3>
                    <p id="hiredApplications">0</p>
                </div>
            </section>

            <section class="analytics-section">
                <div class="chart-card">
                    <h2>Recruitment Analytics</h2>

                    <div class="chart-container">
                        <canvas id="recruitmentChart"></canvas>
                    </div>
                </div>
            </section>

            <section class="toolbar">
                <input type="text" id="searchInput" placeholder="Search candidates...">

                <select id="statusFilter">
                    <option value="all">All Statuses</option>
                    <option value="New">New</option>
                    <option value="Reviewed">Reviewed</option>
                    <option value="Interview Stage">Interview Stage</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Hired">Hired</option>
                </select>

                <button id="exportCsvBtn">Export CSV</button>
                <button id="logoutBtn" class="danger-btn">Logout</button>
            </section>

            <section class="applications-section">
                <h2>Candidate Applications</h2>

                <div id="applicationsList" class="applications-list">
                    <p class="empty-message">Loading applications...</p>
                </div>
            </section>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="charts.js"></script>
    <script src="admin.js"></script>

</body>
</html>
