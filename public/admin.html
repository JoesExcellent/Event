<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMC Admin Dashboard</title>

    <link rel="stylesheet" href="style.css?v=22">

    <style>
        body {
            background: #061b2f;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            color: white;
        }

        .dashboard {
            max-width: 1400px;
            margin: auto;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 50px;
        }

        h2 {
            font-size: 32px;
        }

        .login-box,
        .application-card,
        .stat-card {
            background: #123456;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            border: none;
            margin: 10px 0 20px 0;
            font-size: 18px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }

        button {
            background: #ff6600;
            border: none;
            color: white;
            padding: 18px 30px;
            border-radius: 40px;
            cursor: pointer;
            margin: 10px 10px 10px 0;
            font-size: 20px;
            font-weight: bold;
        }

        button:hover {
            background: #ff7a1a;
        }

        a {
            color: #ff9900;
        }

        #loginMessage {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        #adminInfo {
            font-size: 20px;
            margin: 20px 0;
        }

        #stats {
            margin-top: 30px;
        }

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .toast-success {
            background: #27ae60;
        }

        .toast-error {
            background: #c0392b;
        }

        .toast-info {
            background: #2980b9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card p {
            font-size: 40px;
            font-weight: bold;
            margin: 0;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 42px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="toastContainer"></div>

    <div class="dashboard">

        <h1>TEMC Recruitment Dashboard</h1>

        <div id="loginBox" class="login-box">
            <h2>Admin Login</h2>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="username"
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
            >

            <button id="loginBtn" type="button">Login</button>

            <p id="loginMessage"></p>
        </div>

        <div id="dashboardContent" style="display:none;">

            <button id="logoutBtn" type="button">Logout</button>
            <button id="exportCsvBtn" type="button">Export CSV</button>

            <div id="adminInfo"></div>

            <div id="stats"></div>

            <div id="applications"></div>

        </div>

    </div>

    <script src="admin.js?v=22"></script>

</body>
</html>
