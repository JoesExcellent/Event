<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Excellent Event Management Admin Dashboard</title>

    <link rel="stylesheet" href="style.css?v=23">

    <style>
        body {
            background: #061b2f;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: white;
        }

        .navbar {
            background: #03111f;
            padding: 18px 40px;
            display: flex;
            gap: 38px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 2px solid #ff6600;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .navbar a:hover,
        .navbar a.active {
            background: #ff6600;
            color: white;
        }

        .dashboard {
            width: 92%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 42px 0 70px;
        }

        h1 {
            font-size: 52px;
            line-height: 1.05;
            margin: 0 0 36px;
            font-weight: 800;
        }

        h2 {
            font-size: 28px;
            margin: 0 0 22px;
        }

        .hero-image-placeholder {
            width: 100%;
            min-height: 260px;
            border: 4px dashed rgba(122, 201, 255, 0.55);
            border-radius: 24px;
            background: linear-gradient(135deg, #14507d, #173f67);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #9adfff;
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 28px;
            box-sizing: border-box;
        }

        .text-placeholder {
            background: rgba(255,255,255,0.06);
            border-left: 6px solid #ff6600;
            border-radius: 18px;
            padding: 24px 28px;
            margin: 0 0 34px;
            font-size: 19px;
            line-height: 1.65;
        }

        .login-box,
        .application-card,
        .stat-card,
        .permission-box,
        #adminInfo {
            background: #123f68;
            padding: 28px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: none;
            margin: 8px 0 18px 0;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }

        button {
            background: #ff6600;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 28px;
            cursor: pointer;
            margin: 8px 8px 8px 0;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.2;
        }

        button:hover {
            background: #ff7a1a;
        }

        #logoutBtn,
        #exportCsvBtn {
            padding: 11px 22px;
            font-size: 15px;
            border-radius: 28px;
        }

        a {
            color: #ffcc00;
        }

        #loginMessage {
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
        }

        #adminInfo {
            font-size: 17px;
            line-height: 1.7;
            margin: 24px 0;
        }

        #stats {
            margin-top: 26px;
        }

        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .toast-success { background: #27ae60; }
        .toast-error { background: #c0392b; }
        .toast-info { background: #2980b9; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 22px;
            margin-bottom: 30px;
        }

        .stat-card p {
            font-size: 34px;
            font-weight: bold;
            margin: 0;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 20px;
            font-weight: bold;
        }

        .role-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .role-owner { background: #c0392b; color: white; }
        .role-recruiter { background: #2980b9; color: white; }
        .role-viewer { background: #7f8c8d; color: white; }

        .permission-box {
            border-left: 4px solid #ff9900;
        }

        .analytics-card {
            max-width: 920px;
            margin: 30px auto;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 780px;
            height: 260px !important;
            max-height: 260px !important;
            margin: 0 auto;
        }

        #applicationsChart,
        #recruitmentChart {
            width: 100% !important;
            height: 260px !important;
            max-height: 260px !important;
        }

        @media (max-width: 700px) {
            .dashboard {
                width: 92%;
                padding-top: 28px;
            }

            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 24px;
            }

            .navbar {
                gap: 16px;
                padding: 16px 20px;
            }

            .navbar a {
                font-size: 14px;
                padding: 8px 10px;
            }

            .hero-image-placeholder {
                min-height: 180px;
                font-size: 20px;
            }

            .chart-wrapper,
            #applicationsChart,
            #recruitmentChart {
                height: 220px !important;
                max-height: 220px !important;
            }

            button {
                width: auto;
                font-size: 13px;
                padding: 9px 14px;
            }
        }
    </style>
</head>

<body>


  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="home.html">About</a>
    <a href="our-services.html">Our Services</a>
    <a href="careers.html">Careers</a>
    <a href="contact us.html">Contact Us</a>
    <a href="admin.html" class="active">Admin</a>
</nav>

    <div id="toastContainer"></div>

    <div class="dashboard">

        <h1>TEMC Recruitment Dashboard</h1><div class="hero-image-placeholder">
    Admin Dashboard Banner Placeholder
</div>

<div class="text-placeholder">
    Add administrator dashboard information here.
    Describe recruitment management, reporting,
    candidate tracking and interview coordination.
</div>

        <div id="loginBox" class="login-box">
            <h2>Admin Login</h2>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="username"
            >

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
            >

            <button id="loginBtn" type="button" onclick="loginAdmin()">Login</button>
            <p id="loginMessage"></p>
        </div>

        <div id="dashboardContent" style="display:none;">

            <button id="logoutBtn" type="button">Logout</button>
            <button id="exportCsvBtn" type="button">Export CSV</button>

            <div id="adminInfo"></div>

<div id="permissionsInfo" class="permission-box"></div>

<div id="stats"></div>

<div class="application-card analytics-card">
    <h2>Recruitment Analytics</h2>
    <div class="chart-wrapper">
        <canvas id="applicationsChart"></canvas>
    </div>
</div>

<div id="applications"></div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="charts.js?v=29"></script>
    <script src="admin.js?v=29"></script>

</body>
</html>
