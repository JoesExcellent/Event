<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | The Excellent Management Company</title>
    <link rel="stylesheet" href="style.css?v=40">
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="">Home</a>
    <a href="home.html" class="">About</a>
    <a href="our-services.html" class="">Our Services</a>
    <a href="careers.html" class="">Careers</a>
    <a href="contact%20us.html" class="">Contact Us</a>
    <a href="admin.html" class="active">Admin</a>
</nav>
<div id="toastContainer"></div>
<main class="dashboard">
    <header class="dashboard-header">
        <h1>TEMC Recruitment Dashboard</h1>
        <div class="hero-image-placeholder">Admin Dashboard Banner Placeholder</div>
        <div class="text-placeholder">
            Add administrator dashboard information here. Describe recruitment management, reporting, candidate tracking and interview coordination.
        </div>
    </header>

    <section id="loginBox" class="login-box">
        <h2>Admin Login</h2>
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" placeholder="Enter admin email" autocomplete="username">
        <label for="adminPassword">Admin Password</label>
        <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password">
        <button id="loginBtn" type="button">Login</button>
        <p id="loginMessage"></p>
    </section>

    <section id="dashboardContent" class="hidden">
        <div class="top-actions">
            <button id="logoutBtn" type="button" class="small-btn">Logout</button>
            <button id="exportCsvBtn" type="button" class="small-btn">Export CSV</button>
        </div>

        <div id="adminInfo"></div>
        <div id="stats"></div>

        <section class="analytics-card">
            <h2>Recruitment Analytics</h2>
            <div class="chart-wrapper">
                <canvas id="applicationsChart"></canvas>
            </div>
        </section>

        <div id="filterBox"></div>
        <div id="applications"></div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="charts.js?v=40"></script>
<script src="admin.js?v=40"></script>
</body>
</html>
