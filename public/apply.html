<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMC Recruitment System</title>

    <link rel="stylesheet" href="style.css?v=23">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061b2f;
            color: white;
        }

        .navbar {
            background: #03111f;
            padding: 18px 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 2px solid #ff6600;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .navbar a:hover,
        .navbar a.active {
            background: #ff6600;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            background: #123456;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            font-size: 56px;
            margin-bottom: 30px;
        }

        input,
        textarea {
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            font-size: 18px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .uploadLabel {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        button:hover {
            background: #ff7a1a;
        }

        .form-message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            .navbar a {
                display: block;
                text-align: center;
            }

            h1 {
                font-size: 40px;
            }

            .card {
                padding: 25px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="home.html">About</a>
    <a href="our-services.html">Our Services</a>
    <a href="careers.html">Careers</a>
    <a href="apply.html" class="active">Apply</a>
    <a href="contact us.html">Contact Us</a>
    <a href="admin.html">Admin</a>
</nav>

    <main class="container">

        <section class="card">

            <h2>Apply Now</h3>
<div class="hero-image-placeholder">
    Homepage Hero Photograph Placeholder
</div>

<div class="text-placeholder">
    Add homepage introduction text here.
    Introduce The Excellent Management Company,
    your recruitment services, leadership programmes,
    company values and candidate opportunities.
</div>

            <form id="applicationForm" enctype="multipart/form-data">

                <input
                    type="text"
                    name="fullName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="text"
                    name="position"
                    placeholder="Position Applying For"
                    required
                >

                <textarea
                    name="about"
                    placeholder="Tell us about yourself"
                ></textarea>

                <label class="uploadLabel" for="cvUpload">
                    Upload CV
                </label>

                <input
                    id="cvUpload"
                    type="file"
                    name="cv"
                    accept=".pdf,.doc,.docx"
                    required
                >

                <button type="submit">
                    Submit Application
                </button>

            </form>

            <div id="message" class="form-message"></div>

        </section>

    </main>

    <script src="script.js?v=23"></script>

</body>
</html>
